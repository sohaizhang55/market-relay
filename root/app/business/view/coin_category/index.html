{extend name='../../admin/view/table'}

{block name="button"}
<!--{if auth("add")}-->
<button data-modal='{:url("add")}' data-title="{:lang('添加产品类型')}"
    class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('添加产品类型')}</button>
<!--{/if}-->
{/block}

{block name="content"}
<div class="layui-tab layui-tab-card">
    <div class="layui-tab-content">
        {include file='coin_category/index_search'}
        <table id="CoinCategoryTable" data-url="{:sysuri('index')}" data-target-search="form.form-search"></table>
    </div>
</div>

<script>
    $(function () {
        $('#CoinCategoryTable').layTable({
            even: true, height: 'full',
            sort: { field: 'sort desc,id', type: 'desc' },
            cols: [[
                { field: 'sort', title: '{:lang("排序权重")}', width: 100, align: 'center', sort: true, templet: '#SortInputTpl' },
                { field: 'code', title: '{:lang("类型代码")}', minWidth: 120, align: 'center' },
                { field: 'title', title: '{:lang("类型标题")}', minWidth: 150, align: 'center' },
                { field: 'status', title: '{:lang("前端显示")}', align: 'center', minWidth: 110, templet: '#StatusSwitchTpl' },
                { field: 'create_at', title: '{:lang("创建时间")}', align: 'center', minWidth: 170, sort: true },
                { toolbar: '#toolbar', title: '{:lang("操作面板")}', align: 'center', minWidth: 150, fixed: 'right' }
            ]]
        });

        // 数据状态切换操作 (1=启用, 2=禁用)
        layui.form.on('switch(StatusSwitch)', function (obj) {
            var data = { id: obj.value, status: obj.elem.checked ? 1 : 2 };
            $.form.load("{:url('state')}", data, 'post', function (ret) {
                if (ret.code < 1) $.msg.error(ret.info, 3, function () {
                    $('#CoinCategoryTable').trigger('reload');
                }); else {
                    $('#CoinCategoryTable').trigger('reload')
                }
                return false;
            }, false);
        });
    });
</script>

<!-- 数据状态切换模板 -->
<script type="text/html" id="StatusSwitchTpl">
    <!--{if auth("state")}-->
<input type="checkbox" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('已显示')}|{:lang('已隐藏')}"
    lay-filter="StatusSwitch" {{-d.status==1?'checked':''}}>
<!--{else}-->
{{-d.status==1 ? '<b class="color-green">{:lang("已显示")}</b>' : '<b class="color-red">{:lang("已隐藏")}</b>'}}
<!--{/if}-->
</script>

<!-- 列表排序权重模板 -->
<script type="text/html" id="SortInputTpl">
    <input type="number" min="0" data-blur-number="0" data-action-blur="{:sysuri()}" data-value="id#{{d.id}};action#sort;sort#{value}" data-loading="false" value="{{d.sort}}" class="layui-input text-center">
</script>

<script type="text/html" id="toolbar">
    <!--{if auth("edit")}-->
<a class="layui-btn layui-btn-sm" data-event-dbclick data-title="{:lang('编辑产品类型')}"
    data-modal='{:url("edit")}?id={{d.id}}'>{:lang('编 辑')}</a>
<!--{/if}-->
</script>
{/block}
