<fieldset>
    <legend>{:lang('条件搜索')}</legend>
    <form class="layui-form layui-form-pane form-search" action="{:sysuri()}" onsubmit="return false" method="get" autocomplete="off">
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">{:lang('交易对')}</label>
            <div class="layui-input-inline" style="width:260px">
                <select class="layui-select" name="pair_id" lay-search>
                    {foreach $pairs as $id=>$label}
                    <option value="{$id}" {if isset($get.pair_id) && $get.pair_id eq (string)$id}selected{elseif !isset($get.pair_id) && $pairId eq $id}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> {:lang('查 询')}</button>
        </div>
        <div class="layui-form-item layui-inline">
            <span class="help-block">{:lang('即分发给订阅方的数据')}</span>
        </div>
        {if isset($depthAt)}
        <div class="layui-form-item layui-inline">
            <span class="help-block">{:lang('缓存更新')}: <span id="DepthAtText">{$depthAt|default='-'}</span></span>
        </div>
        {/if}
    </form>
</fieldset>
