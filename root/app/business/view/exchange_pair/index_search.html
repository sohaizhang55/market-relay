<fieldset>
    <legend>{:lang('条件搜索')}</legend>
    <form class="layui-form layui-form-pane form-search" action="{:sysuri()}" onsubmit="return false" method="get" autocomplete="off">
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">{:lang('类型')}</label>
            <div class="layui-input-inline">
                <select name="type">
                    <option value="">{:lang('全部')}</option>
                    {foreach $types as $k=>$v}
                    <option value="{$k}" {if ($get.type??'') == $k}selected{/if}>{$v}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">{:lang('状态')}</label>
            <div class="layui-input-inline">
                <select name="status">
                    <option value="">{:lang('全部')}</option>
                    {foreach $statuses as $k=>$v}
                    <option value="{$k}" {if ($get.status??'') == $k}selected{/if}>{$v}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">{:lang('交易对代码')}</label>
            <div class="layui-input-inline">
                <input name="symbol_code" value="{$get.symbol_code|default=''}" placeholder="{:lang('如 btcusdt')}" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">{:lang('数据源')}</label>
            <div class="layui-input-inline">
                <input name="source_key" value="{$get.source_key|default=''}" placeholder="{:lang('如 HUOBI_btcusdt_2')}" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> {:lang('搜 索')}</button>
        </div>
    </form>
</fieldset>
